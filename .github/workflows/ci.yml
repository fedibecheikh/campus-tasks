name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Défi final : matrice 3.11 / 3.12 sans annulation immédiate
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Rapport de tests
        run: pytest -q --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-${{ matrix.python-version }}
          path: report.xml

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: campus-tasks:ci
      - name: Vérifier que l'image démarre et répond
        run: |
          docker run -d --name smoke campus-tasks:ci
          for i in $(seq 1 12); do
            if docker exec smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"; then
              echo "image saine"
              exit 0
            fi
            sleep 5
          done
          echo "image non saine" >&2
          docker logs smoke >&2
          exit 1

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fedibecheikh/campus-tasks:${{ github.ref_name }}
